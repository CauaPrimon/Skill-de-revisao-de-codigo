<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validador de CPF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f2f2f2;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 220px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2b6cb0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1a4e8a;
    }
    #resultado {
      margin-top: 15px;
      font-weight: bold;
    }
    .valido {
      color: green;
    }
    .invalido {
      color: red;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Validador de CPF</h2>
    <input type="text" id="cpfInput" placeholder="Digite o CPF">
    <br>
    <button onclick="validarCPF()">Validar</button>
    <div id="resultado"></div>
  </div>

  <script>
    function validarCPF() {
      const input = document.getElementById('cpfInput').value;
      const resultado = document.getElementById('resultado');

      let cpf = input.replace(/[^\d]+/g, '');

      if (cpf.length !== 11) {
        resultado.textContent = "CPF inválido: deve conter 11 dígitos";
        resultado.className = "invalido";
        return;
      }

      if (/^(\d)\1{10}$/.test(cpf)) {
        resultado.textContent = "CPF inválido";
        resultado.className = "invalido";
        return;
      }

      let soma = 0;
      let resto;

      for (let i = 1; i <= 9; i++) {
        soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
      }
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(9, 10))) {
        resultado.textContent = "CPF inválido";
        resultado.className = "invalido";
        return;
      }

      soma = 0;
      for (let i = 1; i <= 10; i++) {
        soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
      }
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.substring(10, 11))) {
        resultado.textContent = "CPF inválido";
        resultado.className = "invalido";
        return;
      }

      resultado.textContent = "CPF válido!";
      resultado.className = "valido";
    }
  </script>

</body>
</html>
